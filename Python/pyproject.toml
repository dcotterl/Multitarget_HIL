[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data_sharing_framework_config_api"
version = "0.1.0"
description = "Python tooling for RDMA-based multitarget HIL configuration workflows"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["data_sharing_framework_config_api*"]

[tool.ruff]
line-length = 100

target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
